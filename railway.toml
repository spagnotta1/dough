# `Procfile` — continues to come from the service settings in the dashboard.

[deploy]
# A check that the migration chain applies cleanly from an empty database.
# **This is not how the live database gets migrated** — see `Procfile` for that,
# and read on for why it cannot be done here.
#
# ## Why the migration is not run here
#
# The obvious home for `flask db upgrade` is a pre-deploy command, and it does
# not work on this deployment. Railway's volume documentation:
#
#   "Volumes are not mounted during pre-deploy time, if your pre-deploy command
#    attempts to read or write data to a volume, it should be done as part of
#    the start command."
#
# The database is on the volume, at `/data/checkbook.db`. So a pre-deploy
# `flask db upgrade` resolves `DATABASE_URL` against a path that is not there,
# creates an empty SQLite file in the throwaway container, migrates *that*, and
# exits zero. Measured rather than assumed: the first deploy of this file logged
# `Running upgrade  -> 3b62eabfb5e5` and every revision after it — the whole
# chain from zero, against a database that had never existed — while the live
# one sat at head, untouched, four hundred rows heavier.
#
# A hook that reports success while protecting nothing is worse than no hook,
# because the next person reads the config and stops looking.
#
# ## What it is instead
#
# Left in place, deliberately, for the one thing it *can* do: a broken revision
# — a syntax error, a bad `down_revision`, an `op` call that raises — fails the
# deploy here, before the start command reaches the real database with it. That
# is a fresh-database check only. It cannot catch a revision that is valid in
# the abstract and wrong against production's actual data, which is what
# `tools/backup_db.py` and the disaster-recovery runbook are for.
#
# `flask db upgrade` needs no `FLASK_APP` — Flask's discovery finds `create_app`
# in `app.py`, at the image's working directory.
preDeployCommand = ["flask db upgrade"]
