[pytest]
testpaths = tests
python_files = test_*.py

# -r a  reports xfail/xpass reasons in the summary. That matters here because
# several suites are written as forward specifications: they xfail(strict=True)
# until the phase that implements them, and the summary is how you see what is
# still outstanding without opening the files.
addopts = -ra --strict-markers

markers =
    slow: long-running (full migration round-trips). Skip with -m "not slow".
    browser: drives a real Chromium against a live server (tests/browser/).
        Applied automatically to everything in that directory. Skipped
        wholesale when playwright is not installed, so the rest of the suite
        never depends on a 130MB browser download. Skip with -m "not browser".

filterwarnings =
    default
    # Flask-SQLAlchemy's Model.query and Query.get() are legacy in SQLAlchemy
    # 2.0 but still the idiom throughout this codebase. Silence the noise so a
    # real warning is visible; removing the usage is tracked separately.
    ignore:.*Query.get\(\) method is considered legacy.*:DeprecationWarning
    ignore:.*LegacyAPIWarning.*:DeprecationWarning
