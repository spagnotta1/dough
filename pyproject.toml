[project]
name = "check"
version = "0.1.0"
requires-python = ">=3.12"

# Vercel's Python builder resolves dependencies with `uv lock` and prefers this
# file over requirements.txt whenever both exist, with no warning when the list
# is short. A `[project]` table with no `dependencies` key is therefore not a
# neutral placeholder -- it is an instruction to install nothing, and the
# failure arrives at import time as `No module named 'flask'` rather than at
# build time.
#
# These pins mirror the runtime half of requirements.txt, which carries the
# reasoning for each one and stays the source of truth for CI and for local
# installs. The duplication is real and is the thing to watch: this repository
# has already been bitten once by two dependency lists disagreeing (see the
# header of requirements.txt). Change one, change the other.
#
# Deliberately absent, because nothing a request touches imports them:
#   pytest  -- test-only.
#   pillow  -- build-time only, for tools/build_icons.py.
# Both would otherwise ship in the function bundle.
dependencies = [
    # --- Web framework ---
    "Flask==3.1.3",
    "Werkzeug==3.1.6",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.0.5",
    "SQLAlchemy==2.0.27",

    # --- Auth ---
    "argon2-cffi==21.3.0",

    # --- Data / analysis ---
    "pandas==2.1.3",
    "python-dateutil==2.9.0.post0",
    "scikit-learn==1.7.0",

    # --- Integrations ---
    "anthropic==0.87.0",
    "requests==2.33.0",
    "cryptography==48.0.1",

    # --- Utilities ---
    "python-dotenv==1.2.2",
    "Markdown==3.8.2",

    # --- Database driver ---
    # Not in requirements.txt, and the one entry here with no counterpart to
    # pin against: local installs run on the SQLite default, which needs no
    # driver. A serverless deployment cannot -- the filesystem is ephemeral --
    # so DATABASE_URL will point at Postgres, and `config._database_uri`
    # normalises that to the `postgresql+psycopg://` scheme, which is psycopg 3.
    # Without this the app fails to boot on the first engine connection.
    "psycopg[binary]>=3.2",
]

[tool.vercel]
entrypoint = "wsgi:app"
