name: CI

on:
  push:
    branches: [main, investments-wealth-platform]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 matches the development environment. 3.11 catches the version
        # drift early rather than at upgrade time.
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # conftest.py strips PLAID_* and COINBASE_* from the environment, so
        # this exercises sandbox mode with no network access and no secrets.
        run: python -m pytest -q

      - name: Fail if a forward-spec test started passing
        # -ra already surfaces XPASS, and strict=True turns it into a failure,
        # so this step is really just a readable name in the run summary.
        run: echo "strict xfail markers are enforced by pytest.ini"

  browser:
    # The half of the UI that files cannot show: horizontal overflow, dialogs
    # that open, focus that lands, JavaScript that throws. See
    # tests/browser/conftest.py for what this covers and why it is separate.
    #
    # Its own job rather than a step in `test`, because it needs a browser
    # download that the unit suite has no use for, and because a Chromium
    # failure should read as "the browser suite broke", not as a mystery in the
    # middle of a 640-test run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-browser.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-browser.txt

      - name: Install Chromium
        # --with-deps brings the shared libraries the headless browser needs on
        # a bare ubuntu runner; without it the launch fails on a missing .so.
        run: python -m playwright install --with-deps chromium

      - name: Run browser regressions
        run: python -m pytest tests/browser -q

  # Advisory only: a new CVE in a transitive dependency should raise a flag,
  # not block an unrelated pull request at 2am. `continue-on-error` keeps the
  # overall run green, but this job still shows a red X of its own when it
  # finds something — that is the flag, not a broken build. Read it as "there
  # is security debt", and check the `test` and `browser` jobs for whether the
  # code is actually failing.
  audit-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit dependencies (advisory — a finding here does not block)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --desc
