{% extends "base.html" %}
{% block title %}Connections · Dough{% endblock %}

{% block content %}
{# Phase 9 Wave 2. Linked stylesheet, not an inline <style>: SPA navigation
   replaces <main> only, so a <link> in <head> would never arrive on a
   client-side navigation to this page. #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/connections.css') }}">

<div id="connections-page" class="ds-stack ds-stack-6" x-data="connectionsApp()">

  <!-- Header -->
  <div class="ds-row ds-row--between ds-row--wrap">
    <div>
      <h1 class="ds-section__title">Financial Connections</h1>
      <p class="ds-section__sub">Connect an institution once — balances, holdings, and transactions sync automatically every 12 hours</p>
    </div>
    <div class="ds-row">
      <span x-show="syncing" class="ds-row conn-syncing">
        <svg class="ds-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle opacity=".25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path opacity=".75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        Syncing…
      </span>
      <button @click="syncAll()" :disabled="syncing" class="ds-btn ds-btn--primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/>
        </svg>
        Refresh All
      </button>
      <a href="/sync-history" class="ds-btn ds-btn--secondary">Sync History</a>
    </div>
  </div>

  <!-- Connected institutions -->
  {% set active_connections = connections|rejectattr('status', 'equalto', 'disconnected')|list %}
  <section class="ds-card" aria-labelledby="connectedHeading">
    <div class="ds-card__head">
      <h2 id="connectedHeading" class="ds-section__title">Connected Institutions</h2>
    </div>
    {% if active_connections %}
    <div class="conn-list">
      {% for c in active_connections %}
      <div class="conn-row ds-row ds-row--between ds-row--wrap" id="conn-{{ c.id }}">
        <div class="ds-row conn-row__info">
          <span class="conn-dot conn-dot--{{ 'ok' if c.status == 'connected' else 'warn' if c.status == 'expired' else 'danger' }}"
                title="{{ c.status }}"></span>
          <div class="conn-row__info">
            <p class="conn-row__name">{{ c.display_name }}</p>
            <p class="conn-row__meta">
              {{ c.account_count }} account{% if c.account_count != 1 %}s{% endif %}
              {% if c.last_sync_at %} · Last sync {{ c.last_sync_at }}{% else %} · Never synced{% endif %}
              {% if c.status != 'connected' %}
                · <span class="conn-row__error">{{ c.last_error or c.status }}</span>
              {% endif %}
            </p>
          </div>
        </div>
        <div class="ds-row">
          <button @click="syncOne({{ c.id }})" :disabled="syncing" class="ds-btn ds-btn--sm ds-btn--secondary">
            Refresh
          </button>
          <button @click="disconnect({{ c.id }}, '{{ c.display_name }}')" class="ds-btn ds-btn--sm ds-btn--danger">
            Disconnect
          </button>
        </div>
      </div>
      {% endfor %}
    </div>
    {% else %}
    <div class="ds-empty">
      <span class="ds-empty__art" data-dough="greeting" data-dough-size="104"></span>
      <p class="ds-empty__title">No banks connected yet</p>
      <p class="ds-empty__body">Connect one below and I'll keep your
        transactions up to date on my own — you won't have to upload
        anything again.</p>
    </div>
    {% endif %}
  </section>

  <!-- Synced accounts -->
  {% if accounts %}
  <section class="ds-card" aria-labelledby="syncedHeading">
    <div class="ds-card__head">
      <h2 id="syncedHeading" class="ds-section__title">Synced Accounts</h2>
    </div>
    <div class="ds-table-wrap ds-scroll">
      <table class="ds-table ds-table--hover">
        <thead>
          <tr>
            <th scope="col">Institution</th>
            <th scope="col">Account</th>
            <th scope="col">Type</th>
            <th scope="col" class="ds-table__num">Balance</th>
            <th scope="col">Last Synced</th>
          </tr>
        </thead>
        <tbody>
          {% for a in accounts %}
          <tr>
            <td class="conn-capitalize">{{ a.institution.replace('_', ' ') }}</td>
            <td>
              {{ a.name }}{% if a.mask %} <span class="conn-mask">••{{ a.mask }}</span>{% endif %}
            </td>
            <td>
              <span class="ds-badge conn-capitalize {{ 'ds-badge--info' if a.account_type == 'checking'
                else 'ds-badge--ok' if a.account_type == 'savings'
                else 'ds-badge--ai' if a.account_type == 'brokerage'
                else 'ds-badge--warn' if a.account_type == 'crypto'
                else '' }}">
                {{ a.account_type }}
              </span>
            </td>
            <td class="ds-table__num">${{ "{:,.2f}".format(a.balance) }}</td>
            <td>{{ a.last_synced_at or '—' }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </section>
  {% endif %}

  <!-- Available institutions -->
  <section class="ds-card" aria-labelledby="addInstitutionHeading">
    <div class="ds-card__head">
      <div>
        <h2 id="addInstitutionHeading" class="ds-section__title">Add an Institution</h2>
        <p class="ds-section__sub">
          Connect an institution to sync its live data. Balances, holdings, and transactions
          update automatically every 12 hours.
        </p>
      </div>
    </div>
    <div class="conn-institutions">
      {% for inst in institutions %}
      <div class="ds-card ds-card--compact ds-stack ds-stack-3">
        <div class="conn-inst__head">
          <span class="conn-inst__icon"
                style="background: {{ inst.accent_color }}; color: {{ inst.ink_color }}">
            {{ inst.display_name[0] }}
          </span>
          <div>
            <p class="conn-inst__name">{{ inst.display_name }}</p>
            <p class="conn-inst__mode">
              {% if inst.mode == 'live' %}Live API
              {% elif not inst.live_api_available %}Sandbox · no public API
              {% else %}Sandbox{% endif %}
            </p>
          </div>
        </div>
        <p class="conn-inst__desc">
          {% if inst.institution == 'plaid' %}Aggregator — link any supported bank, brokerage, or
          crypto exchange through one connection.
          {% elif inst.supports_transactions and inst.supports_holdings %}Balances, holdings &amp; transactions
          {% elif inst.supports_transactions %}Balances &amp; transactions
          {% elif inst.supports_holdings %}Balances &amp; holdings
          {% else %}Balances{% endif %}
        </p>
        {% if inst.connected and inst.institution != 'plaid' %}
        <span class="ds-badge ds-badge--ok ds-badge--pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
          Connected
        </span>
        {% else %}
        <button @click="connect('{{ inst.institution }}', '{{ inst.display_name }}', '{{ inst.mode }}')"
            :disabled="connecting === '{{ inst.institution }}'"
            class="ds-btn ds-btn--sm conn-inst__connect"
            style="background: {{ inst.accent_color }}; color: {{ inst.ink_color }}">
            <span x-show="connecting !== '{{ inst.institution }}'">{% if inst.institution == 'plaid' and inst.connected %}Link another institution{% else %}Connect{% endif %}</span>
            <span x-show="connecting === '{{ inst.institution }}'">Connecting…</span>
        </button>
        {% endif %}
      </div>
      {% endfor %}
    </div>
  </section>

</div>

<!-- connectionsApp must be defined before any script that loads over the
     network: SPA navigation re-runs these scripts sequentially, and Alpine
     initializes the swapped-in DOM as soon as the current task yields — if
     the definition waits behind the Plaid CDN download, x-data="connectionsApp()"
     fails and the Connect buttons render blank. -->
<script>
function connectionsApp() {
    return {
        syncing: false,
        connecting: null,
        _pollTimer: null,

        // Alpine calls init() automatically. If the URL carries an
        // oauth_state_id we are returning from a bank's OAuth login page
        // (Capital One, Chase, …) — Plaid Link must be reopened with the
        // same link token to finish the handshake.
        init() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('oauth_state_id')) {
                const token = sessionStorage.getItem('plaid_link_token');
                if (token) {
                    // The Plaid CDN script loads async — wait for it briefly.
                    const href = window.location.href;
                    const tryOpen = (attempts) => {
                        if (typeof Plaid !== 'undefined') { this._openPlaid(token, href); }
                        else if (attempts > 0) { setTimeout(() => tryOpen(attempts - 1), 250); }
                        else { showToast('Plaid Link script failed to load — reload and try again.', 'error'); }
                    };
                    tryOpen(40);
                } else {
                    showToast('Bank login finished but the Plaid session was lost — please connect again.', 'warning');
                }
                history.replaceState(null, '', window.location.pathname);
            }
        },

        async connect(institution, displayName, mode) {
            this.connecting = institution;
            if (institution === 'plaid' && mode === 'live') {
                await this.connectPlaid();
                this.connecting = null;
                return;
            }
            try {
                const resp = await fetch('/api/connections', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ institution: institution }),
                });
                const data = await resp.json();
                if (resp.status === 202 && data.authorize_url) {
                    // Live OAuth: hand off to the provider's consent page.
                    window.location.href = data.authorize_url;
                    return;
                }
                if (!resp.ok) {
                    showToast(data.error || 'Connection failed.', 'error');
                    return;
                }
                showToast(displayName + ' connected — first sync started.', 'success');
                this.pollUntilIdle();
            } catch (e) {
                showToast('Connection failed: ' + e.message, 'error');
            } finally {
                this.connecting = null;
            }
        },

        // Plaid's handshake is a client-side widget, not a redirect: fetch a
        // Link token, open the widget, then exchange the public_token it
        // returns for a stored access token server-side.
        async connectPlaid() {
            if (typeof Plaid === 'undefined') {
                showToast('Plaid Link script failed to load — check your connection or ad-blocker, then reload.', 'error');
                return;
            }
            try {
                const tokenResp = await fetch('/api/plaid/link-token', { method: 'POST' });
                const tokenData = await tokenResp.json();
                if (!tokenResp.ok) {
                    showToast(tokenData.error || 'Could not start Plaid Link.', 'error');
                    return;
                }
                // OAuth institutions redirect the whole page to the bank and
                // back — persist the token so init() can resume the session.
                sessionStorage.setItem('plaid_link_token', tokenData.link_token);
                this._openPlaid(tokenData.link_token, null);
            } catch (e) {
                showToast('Plaid Link failed: ' + e.message, 'error');
            }
        },

        _openPlaid(linkToken, receivedRedirectUri) {
            try {
                const self = this;
                const config = {
                    token: linkToken,
                    onSuccess: async (public_token, metadata) => {
                        const name = (metadata && metadata.institution) ? metadata.institution.name : 'Institution';
                        const exResp = await fetch('/api/connections/plaid/exchange', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ public_token: public_token, institution_name: name }),
                        });
                        const exData = await exResp.json();
                        if (!exResp.ok) {
                            showToast(exData.error || 'Connection failed.', 'error');
                            return;
                        }
                        sessionStorage.removeItem('plaid_link_token');
                        showToast(name + ' connected — first sync started.', 'success');
                        self.pollUntilIdle();
                    },
                    onExit: (err) => {
                        sessionStorage.removeItem('plaid_link_token');
                        if (err) {
                            showToast('Plaid Link error: ' + (err.display_message || err.error_message || err.error_code), 'error');
                            console.error('Plaid Link exit error', err);
                        }
                    },
                };
                if (receivedRedirectUri) config.receivedRedirectUri = receivedRedirectUri;
                const handler = Plaid.create(config);
                handler.open();
            } catch (e) {
                showToast('Plaid Link failed: ' + e.message, 'error');
            }
        },

        async disconnect(id, displayName) {
            if (!confirm('Disconnect ' + displayName + '? Synced accounts and holdings will be removed; imported transactions are kept.')) return;
            const resp = await fetch('/api/connections/' + id, { method: 'DELETE' });
            if (resp.ok) {
                showToast(displayName + ' disconnected.', 'success');
                location.reload();
            } else {
                const data = await resp.json();
                showToast(data.error || 'Disconnect failed.', 'error');
            }
        },

        async syncAll() {
            const resp = await fetch('/api/sync/all', { method: 'POST' });
            if (resp.status === 409) { showToast('A sync is already running.', 'warning'); return; }
            if (!resp.ok) { showToast('Could not start sync.', 'error'); return; }
            showToast('Sync started for all institutions.', 'info');
            this.pollUntilIdle();
        },

        async syncOne(id) {
            const resp = await fetch('/api/connections/' + id + '/sync', { method: 'POST' });
            if (resp.status === 409) { showToast('A sync is already running.', 'warning'); return; }
            if (!resp.ok) { showToast('Could not start sync.', 'error'); return; }
            showToast('Sync started.', 'info');
            this.pollUntilIdle();
        },

        pollUntilIdle() {
            this.syncing = true;
            clearInterval(this._pollTimer);
            this._pollTimer = setInterval(async () => {
                try {
                    const resp = await fetch('/api/sync/status');
                    const status = await resp.json();
                    if (!status.running) {
                        clearInterval(this._pollTimer);
                        this.syncing = false;
                        showToast('Sync finished.', status.last_status === 'success' ? 'success' : 'warning');
                        location.reload();
                    }
                } catch (e) { /* keep polling */ }
            }, 1500);
        },
    };
}
</script>
<script defer src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
{% endblock %}
