{% extends "base.html" %}

{% block title %}Recurring · Dough{% endblock %}

{% block content %}
{# Phase 9 Wave 2. Linked stylesheet, not an inline <style>: SPA navigation
   replaces <main> only, so a <link> in <head> would never arrive on a
   client-side navigation to this page. #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/recurring.css') }}">
{% from '_filters.html' import caret, ficon %}

<div class="ds-stack ds-stack-6">
    {# One filter, and it now costs one click rather than a card, a labelled
       select and a Filter button. Same component as the dashboard and the
       ledger — `.ds-filters`, static/js/filter-bar.js — so a page with one
       control still looks like the rest of the product.

       No `data-filter-sticky`: this view reads `request.args` only, so an
       absent key and an empty one mean the same thing here. #}
    {% set account_active = account_filter and account_filter != 'both' %}
    <div class="ds-filters" id="recurFilters" data-filter-bar>
        <h2 id="recurFilterHeading" class="ds-sr">Filter by account</h2>
        <form method="GET" action="{{ url_for('insights.recurring') }}"
              class="ds-filters__bar" aria-labelledby="recurFilterHeading">
            <details class="ds-filter-menu ds-filter-menu--lead" id="recurAccountMenu">
                <summary class="ds-filter-trigger {{ 'is-on' if account_active }}" id="recurAccountTrigger">
                    {{ ficon('wallet') }}
                    <span class="ds-sr">Account:</span>
                    <span class="ds-filter-trigger__value">{{ account_filter if account_active else 'All accounts' }}</span>
                    {{ caret() }}
                </summary>
                <div class="ds-filter-menu__pop">
                    <fieldset class="ds-filter-menu__opts">
                        <legend class="ds-sr">Account</legend>
                        <label class="ds-filter-opt ds-filter-opt--choice">
                            <input type="radio" name="account" value="both" data-apply-now data-filter-default
                                   {% if not account_active %}checked{% endif %}>
                            <span class="ds-filter-opt__label">All accounts</span>
                        </label>
                        {% for acct in accounts %}
                        <label class="ds-filter-opt ds-filter-opt--choice">
                            <input type="radio" name="account" value="{{ acct }}" data-apply-now
                                   {% if account_filter == acct %}checked{% endif %}>
                            <span class="ds-filter-opt__label">{{ acct }}</span>
                        </label>
                        {% endfor %}
                    </fieldset>
                </div>
            </details>
        </form>

        {% if account_active %}
        <div class="ds-filter-chips" role="group" aria-label="Applied filters">
            <span class="ds-filter-chip">
                <span class="ds-filter-chip__key">Account</span>
                <span class="ds-filter-chip__val">{{ account_filter }}</span>
                <a class="ds-filter-chip__x" aria-label="Remove the {{ account_filter }} account filter"
                   href="{{ url_for('insights.recurring') }}">✕</a>
            </span>
        </div>
        {% endif %}
    </div>

    <!-- Monthly Bills & Payments -->
    <section class="ds-card" aria-labelledby="billsHeading">
        <div class="recur-head">
            <div>
                <h2 id="billsHeading" class="ds-section__title">Monthly Bills &amp; Payments</h2>
                <p class="ds-section__sub">Debt payments and obligatory bills — loans, credit cards, insurance — based on your category rules. The payment shown is the typical actual amount from your transactions; annual cost reflects how often you actually pay. Payments not seen in the last 6 months are excluded. Not actually a bill? Dismiss it with the ✕.</p>
            </div>
            {% if bills %}
            <div class="recur-stat">
                <p class="ds-eyebrow">Total Monthly</p>
                {% set bills_total = (bills | map(attribute='annual_cost') | sum) / 12 %}
                <p class="recur-stat__value">${{ "{:,.2f}".format(bills_total) }}</p>
            </div>
            {% endif %}
        </div>

        {% if bills %}
        <div class="ds-table-wrap ds-scroll">
            <table id="billsTable" class="ds-table ds-table--hover">
                <thead>
                    <tr>
                        <th scope="col">Description</th>
                        <th scope="col">Category</th>
                        <th scope="col">Account</th>
                        <th scope="col" class="ds-table__num">Payment</th>
                        <th scope="col" class="ds-table__num">Annual Cost</th>
                        <th scope="col" class="recur-table__center">Occurrences</th>
                        <th scope="col" class="recur-table__center">Typical Gap</th>
                        <th scope="col">Last Seen</th>
                        <th scope="col">Next Expected</th>
                        <th scope="col"><span class="ds-sr">Actions</span></th>
                    </tr>
                </thead>
                <tbody>
                    {% for group in bills %}
                    {% set monthly_abs = group.monthly_amount|abs %}
                    <tr>
                        <td class="recur-desc" title="{{ group.description }}">{{ group.description }}</td>
                        <td>{{ group.category }}</td>
                        <td>{{ group.account_name }}</td>
                        <td class="ds-table__num recur-amt--out">-${{ "{:,.2f}".format(monthly_abs) }}</td>
                        <td class="ds-table__num">${{ "{:,.0f}".format(group.annual_cost) }}/yr</td>
                        <td class="recur-table__center">{{ group.occurrences }}</td>
                        <td class="recur-table__center">{{ group.median_gap_days }}d</td>
                        <td class="ds-meta">{{ group.last_seen }}</td>
                        <td class="recur-next">{{ group.next_expected }}</td>
                        <td class="recur-table__center">
                            <form method="POST" action="{{ url_for('insights.recurring_dismiss') }}"
                                  onsubmit="return confirm('Hide “{{ group.description|replace("'","\\'") }}” from this view? You can restore it below.')">
                              {{ csrf_field() }}
                                <input type="hidden" name="description" value="{{ group.description }}">
                                <input type="hidden" name="kind" value="bill">
                                <button type="submit" class="recur-dismiss" title="Not actually a recurring bill — hide it">✕ Dismiss</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <p class="recur-empty">No active recurring bills detected in the last 6 months of data.</p>
        {% endif %}
    </section>

    <!-- Subscriptions + Savings Calculator -->
    <section class="ds-card recur-card--accent" aria-labelledby="subsHeading" x-data="savingsCalc()" x-init="init()">
        <div class="recur-head">
            <div>
                <h2 id="subsHeading" class="ds-section__title">Subscriptions</h2>
                <p class="ds-section__sub">Active subscription services billed monthly. Anything without a charge in the last 6 months is assumed cancelled and hidden. Mark subscriptions as unnecessary to calculate potential annual savings.</p>
            </div>
            <div class="recur-stat">
                <p class="ds-eyebrow">Potential Annual Savings</p>
                <p class="recur-stat__value recur-stat__value--accent" x-text="'$' + totalSavings.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})">$0.00</p>
            </div>
        </div>

        {% if subscriptions %}
        <div class="ds-table-wrap ds-scroll">
            <table id="subsTable" class="ds-table ds-table--hover">
                <thead>
                    <tr>
                        <th scope="col">Subscription</th>
                        <th scope="col" class="ds-table__num">Monthly</th>
                        <th scope="col">Next Renewal</th>
                        <th scope="col" class="recur-table__center">Unnecessary?</th>
                    </tr>
                </thead>
                <tbody>
                    {% for group in subscriptions %}
                    {% set monthly = group.monthly_amount|abs %}
                    {% set annual = monthly * 12 %}
                    {% set desc_key = group.description|replace("'","\\'")|replace('"','\\"') %}
                    <tr :class="{ 'recur-row--marked': isUnnecessary('{{ desc_key }}') }">
                        <td class="recur-desc" title="{{ group.description }}">
                            <span :class="{ 'recur-desc--marked': isUnnecessary('{{ desc_key }}') }">
                                {{ group.description }}
                            </span>
                            <span class="recur-desc__category">{{ group.category }}</span>
                        </td>
                        <td class="ds-table__num recur-amt--out">
                            -${{ "{:,.2f}".format(monthly) }}
                            <span class="recur-amt__annual">${{ "{:,.0f}".format(annual) }}/yr</span>
                        </td>
                        <td class="recur-next">{{ group.next_expected }}</td>
                        <td class="recur-table__center">
                            <button type="button" class="ds-chip" @click="toggle('{{ desc_key }}', {{ annual }})"
                                    :aria-pressed="isUnnecessary('{{ desc_key }}').toString()">
                                <span x-text="isUnnecessary('{{ desc_key }}') ? 'Cancel It ✓' : 'Mark Unnecessary'"></span>
                            </button>
                            <form method="POST" action="{{ url_for('insights.recurring_dismiss') }}" class="recur-inline"
                                  onsubmit="return confirm('Hide “{{ group.description|replace("'","\\'") }}” from this view? You can restore it below.')">
                              {{ csrf_field() }}
                                <input type="hidden" name="description" value="{{ group.description }}">
                                <input type="hidden" name="kind" value="subscription">
                                <button type="submit" class="recur-dismiss" title="Not actually a subscription — hide it">✕ Dismiss</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <p class="recur-empty">No active subscriptions detected in the last 6 months of data.</p>
        {% endif %}
    </section>

    <!-- Dismissed items -->
    {% if dismissals %}
    <details class="ds-card">
        <summary class="recur-dismissed__summary">
            Dismissed items ({{ dismissals|length }}) — hidden from this view and from Claude's context
        </summary>
        <div class="recur-dismissed__list">
            {% for d in dismissals %}
            <div class="recur-dismissed__row">
                <div class="recur-dismissed__desc">
                    <span class="ds-meta">{{ d.description }}</span>
                    <span class="recur-dismissed__meta">{{ 'bill' if d.kind == 'bill' else 'subscription' }} · dismissed {{ d.created_at.strftime('%Y-%m-%d') }}</span>
                </div>
                <form method="POST" action="{{ url_for('insights.recurring_restore') }}">
                  {{ csrf_field() }}
                    <input type="hidden" name="id" value="{{ d.id }}">
                    <button type="submit" class="ds-btn ds-btn--sm ds-btn--ghost">Restore</button>
                </form>
            </div>
            {% endfor %}
        </div>
    </details>
    {% endif %}
</div>

<script>
function savingsCalc() {
    return {
        unnecessary: {},
        totalSavings: 0,
        init() {
            try {
                const saved = localStorage.getItem('unnecessarySubscriptions');
                if (saved) this.unnecessary = JSON.parse(saved);
            } catch(e) {}
            this.recalc();
        },
        toggle(desc, annual) {
            if (this.unnecessary[desc]) {
                delete this.unnecessary[desc];
            } else {
                this.unnecessary[desc] = annual;
            }
            this.recalc();
            try { localStorage.setItem('unnecessarySubscriptions', JSON.stringify(this.unnecessary)); } catch(e) {}
        },
        isUnnecessary(desc) {
            return !!this.unnecessary[desc];
        },
        recalc() {
            this.totalSavings = Object.values(this.unnecessary).reduce((a, b) => a + b, 0);
        }
    };
}
</script>
{% endblock %}
