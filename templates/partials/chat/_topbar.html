{# Ask Dough — top bar and model picker. Split out of chat.html in Phase 9
   Wave 1b and migrated to the design system in Wave 1c. Ids here are
   contracts: static/js/chat.js looks every one of them up by name. #}
    <header id="topbar">
      <button class="ibtn" id="side-open" type="button" title="Show sidebar" aria-label="Show sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
      </button>
      <button id="model-btn" type="button" aria-haspopup="menu" aria-expanded="false">
        <span id="model-name">Dough</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="spacer"></div>
      <button class="ibtn" id="new-chat-top" type="button" title="New chat" aria-label="New chat">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </header>
