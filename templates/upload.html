{% extends "base.html" %}

{% block title %}Upload · Dough{% endblock %}

{% block content %}
{# Phase 9 Wave 2. Linked stylesheet, not an inline <style>: SPA navigation
   replaces <main> only, so a <link> in <head> would never arrive on a
   client-side navigation to this page. #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/upload.css') }}">

<div class="ds-stack ds-stack-6">

    <!-- Undo last import banner -->
    {% if last_batch_id %}
    <div class="ds-card ds-card--warn ds-card--compact upload-undo">
        <div class="upload-undo__msg">
            <svg class="upload-undo__icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            <span class="ds-meta">
                Last import added <strong>{{ last_batch_count }}</strong> transaction(s).
            </span>
        </div>
        <form method="POST" action="{{ url_for('transactions.undo_import', batch_id=last_batch_id) }}"
              onsubmit="return confirm('Remove all {{ last_batch_count }} transaction(s) from the last import? This cannot be undone.')">
          {{ csrf_field() }}
            <button type="submit" class="ds-btn ds-btn--sm ds-btn--secondary">
                Undo Import
            </button>
        </form>
    </div>
    {% endif %}

    <!-- Upload form -->
    <section class="ds-card" aria-labelledby="uploadHeading">
        <div class="ds-card__head">
            <div>
                <h2 id="uploadHeading" class="ds-section__title">Upload Transactions</h2>
                <p class="ds-section__sub">Drop in a CSV export from any bank or card and I'll sort and categorize everything for you. I'll work out the columns myself. Multiple files are fine.</p>
            </div>
        </div>

        <form id="uploadForm" class="ds-stack ds-stack-4" method="POST" enctype="multipart/form-data">
          {{ csrf_field() }}
            <div class="ds-field">
                <label class="ds-label" for="account_name">Account</label>
                <select id="account_name" name="account_name" class="ds-select">
                    <option value="">Select an account</option>
                    <option value="Checking">Checking</option>
                    <option value="Savings">Savings</option>
                </select>
            </div>

            <div class="ds-field">
                <label class="ds-label">CSV Files</label>
                <div id="dropZone" class="upload-dropzone">
                    <div class="upload-dropzone__body">
                        <svg class="upload-dropzone__icon" width="48" height="48" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <div class="ds-row">
                            <span class="upload-dropzone__cta">Click to browse</span>
                            <span class="upload-dropzone__hint">or drag and drop</span>
                        </div>
                        <p id="fileLabel" class="ds-meta">CSV files only</p>
                    </div>
                </div>
                <input id="files" name="files[]" type="file" class="ds-input ds-sr" multiple accept=".csv">
            </div>

            <!-- Preview table (hidden until files selected) -->
            <div id="previewSection" hidden>
                <div class="ds-row ds-row--between upload-preview__head">
                    <h4 id="previewTitle" class="ds-card__title">Preview</h4>
                    <button type="button" onclick="clearFiles()" class="ds-btn ds-btn--sm ds-btn--ghost">Clear</button>
                </div>
                <div class="upload-preview ds-table-wrap ds-scroll">
                    <table class="ds-table ds-table--sticky">
                        <thead>
                            <tr>
                                <th scope="col">Date</th>
                                <th scope="col">Description</th>
                                <th scope="col" class="ds-table__num">Amount</th>
                            </tr>
                        </thead>
                        <tbody id="previewBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="ds-row">
                <button type="submit" id="uploadBtn" class="ds-btn ds-btn--primary">
                    Upload
                </button>
                <span id="uploadStatus" class="ds-meta" hidden>Uploading…</span>
            </div>
        </form>
    </section>
</div>

<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
{% endblock %}
