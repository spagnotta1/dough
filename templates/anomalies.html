{% extends "base.html" %}

{% block title %}Anomalies · Dough{% endblock %}

{% block content %}
{# Phase 9 Wave 2. Linked stylesheet, not an inline <style>: SPA navigation
   replaces <main> only, so a <link> in <head> would never arrive on a
   client-side navigation to this page. #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/anomalies.css') }}">

{# One definition for all five sortable headers, mirroring transactions.html's
   sort_th: the sort state goes on the <th> as aria-sort, which is what a
   screen reader reads when it lands in the column. This page's backend takes
   a single combined `sort` param (e.g. "date_desc") rather than transactions'
   separate sort_by/sort_dir, so the macro is local rather than shared. #}
{% macro sort_th(key, label, numeric=false) %}
  {% set active = (sort_by == key + '_asc' or sort_by == key + '_desc') %}
  {% set current_dir = 'asc' if sort_by == key + '_asc' else ('desc' if active else none) %}
  {% set next_dir = 'asc' if current_dir == 'desc' else 'desc' %}
  <th scope="col"
      {% if numeric %}class="ds-table__num"{% endif %}
      {% if active %}aria-sort="{{ 'ascending' if current_dir == 'asc' else 'descending' }}"{% endif %}>
    <a class="ds-table__sort"
       href="{{ url_for('insights.anomalies', sort=key + '_' + next_dir, show_reviewed=('1' if show_reviewed else '0')) }}">
      <span>{{ label }}</span>
      <span class="ds-table__sort__dir" aria-hidden="true">{% if active %}{{ '▲' if current_dir == 'asc' else '▼' }}{% else %}⇅{% endif %}</span>
    </a>
  </th>
{% endmacro %}

<div class="ds-stack ds-stack-6">
    <section class="ds-card" aria-labelledby="anomaliesHeading">
        <div class="ds-card__head anom-head">
            <div>
                <h2 id="anomaliesHeading" class="ds-section__title">Anomaly Detection</h2>
                <p class="ds-section__sub">Transactions flagged as statistically unusual by amount, day of week, and day of month.</p>
            </div>
            <div class="anom-actions">
                <form action="{{ url_for('insights.anomalies') }}" method="get" class="ds-row">
                    {% if show_reviewed %}
                    <input type="hidden" name="show_reviewed" value="1">
                    {% endif %}
                    <input type="hidden" name="sort" value="{{ sort_by }}">
                    <input type="text" name="search_id" placeholder="Search by ID" class="ds-input anom-search">
                    <button type="submit" class="ds-btn ds-btn--sm ds-btn--secondary">Search</button>
                </form>
                <a href="{{ url_for('insights.anomalies', show_reviewed=('0' if show_reviewed else '1'), sort=sort_by) }}"
                   class="ds-btn ds-btn--sm ds-btn--secondary">
                    {% if show_reviewed %}Hide Reviewed{% else %}Show Reviewed{% endif %}
                </a>
                {% if anomalies.items and not show_reviewed %}
                <button type="button" onclick="dismissAllAnomalies()" class="ds-btn ds-btn--sm ds-btn--danger">
                    Dismiss All
                </button>
                {% endif %}
            </div>
        </div>

        <div class="ds-table-wrap ds-scroll">
            <table id="anomTable" class="ds-table ds-table--hover">
                <thead>
                    <tr>
                        {{ sort_th('id', 'ID') }}
                        {{ sort_th('date', 'Date') }}
                        {{ sort_th('description', 'Description') }}
                        {{ sort_th('amount', 'Amount', numeric=true) }}
                        {{ sort_th('category', 'Category') }}
                        <th scope="col"><span class="ds-sr">Action</span></th>
                    </tr>
                </thead>
                <tbody id="anomalyBody">
                    {% for anomaly in anomalies.items %}
                    <tr id="arow-{{ anomaly.id }}" class="{{ 'anom-row--reviewed' if anomaly.anomaly_reviewed }}">
                        <td>{{ anomaly.id }}</td>
                        <td class="ds-meta">{{ anomaly.date.strftime('%Y-%m-%d') }}</td>
                        <td>{{ anomaly.description }}</td>
                        <td class="ds-table__num {{ 'anom-amt--pos' if anomaly.amount > 0 else 'anom-amt--neg' }}">
                            ${{ "{:,.2f}".format(anomaly.amount) }}
                        </td>
                        <td class="ds-meta">{{ anomaly.category }}</td>
                        <td class="ds-table__num">
                            {% if not anomaly.anomaly_reviewed %}
                            <button onclick="dismissAnomaly({{ anomaly.id }})" class="ds-btn ds-btn--sm ds-btn--secondary anom-dismiss-btn">
                                Dismiss
                            </button>
                            {% else %}
                            <span class="anom-reviewed-label">Reviewed</span>
                            {% endif %}
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="6">
                            <div class="ds-empty">
                              {% if show_reviewed %}
                              <span class="ds-empty__art" data-dough="searching" data-dough-size="104"></span>
                              <p class="ds-empty__title">Nothing unusual here</p>
                              <p class="ds-empty__body">I went through every charge in this range and none of them looked out of place.</p>
                              {% else %}
                              <span class="ds-empty__art" data-dough="proud" data-dough-size="104"></span>
                              <p class="ds-empty__title">You're all caught up</p>
                              <p class="ds-empty__body">Nothing left for you to review. <a href="{{ url_for('insights.anomalies', show_reviewed='1') }}">Show the ones you've already seen</a>.</p>
                              {% endif %}
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        {% if anomalies.pages > 1 %}
        <div class="anom-pager anom-pager-wrap">
            <p class="ds-meta">
                Page <strong>{{ anomalies.page }}</strong> of
                <strong>{{ anomalies.pages }}</strong>
                ({{ anomalies.total }} total)
            </p>
            <nav class="anom-pager__pages" aria-label="Pagination">
                {% if anomalies.has_prev %}
                <a href="{{ url_for('insights.anomalies', page=anomalies.prev_num, sort=sort_by, show_reviewed=('1' if show_reviewed else '0')) }}"
                   class="ds-chip anom-pager__link">&#8592; Prev</a>
                {% endif %}
                {% for p in anomalies.iter_pages() %}
                    {% if p %}
                    <a href="{{ url_for('insights.anomalies', page=p, sort=sort_by, show_reviewed=('1' if show_reviewed else '0')) }}"
                       class="ds-chip anom-pager__link" {% if p == anomalies.page %}aria-current="page"{% endif %}>{{ p }}</a>
                    {% else %}
                    <span class="anom-pager__ellipsis">…</span>
                    {% endif %}
                {% endfor %}
                {% if anomalies.has_next %}
                <a href="{{ url_for('insights.anomalies', page=anomalies.next_num, sort=sort_by, show_reviewed=('1' if show_reviewed else '0')) }}"
                   class="ds-chip anom-pager__link">Next &#8594;</a>
                {% endif %}
            </nav>
        </div>
        {% endif %}
    </section>
</div>

<script>
function dismissAnomaly(id) {
    fetch('/anomalies/' + id + '/dismiss', { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.success) {
            var row = document.getElementById('arow-' + id);
            if (row) row.remove();
            showToast('Anomaly dismissed.', 'success');
        } else {
            showToast('Dismiss failed: ' + data.error, 'error');
        }
    })
    .catch(function() { showToast('Dismiss failed.', 'error'); });
}

function dismissAllAnomalies() {
    if (!confirm('Dismiss all anomalies currently shown? This cannot be undone.')) return;
    var params = new URLSearchParams(window.location.search);
    var url = '/anomalies/dismiss_all' + (params.toString() ? '?' + params.toString() : '');
    fetch(url, { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.success) {
            showToast('Dismissed ' + data.count + ' anomal' + (data.count === 1 ? 'y' : 'ies') + '.', 'success');
            window.location.reload();
        } else {
            showToast('Dismiss all failed: ' + data.error, 'error');
        }
    })
    .catch(function() { showToast('Dismiss all failed.', 'error'); });
}
</script>
{% endblock %}
