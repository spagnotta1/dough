{% extends "base.html" %}

{% block title %}Category Rules · Dough{% endblock %}

{% block content %}
{# Phase 9 Wave 1d. The page is in MIGRATED, so test_ui_invariants.py holds it
   to the cross-cutting rules: no inline <style>, no literal colours, no
   Tailwind utilities, .ds-table, .ds-field/.ds-input, showToast() over alert().

   The script stays inline rather than moving to static/js/rules.js, and that is
   a deliberate difference from chat.html. Half the markup on this page is built
   by JavaScript — every AI suggestion card — and the invariants read the
   *template*. Move the script to a file under static/ and the Tailwind check
   stops seeing the markup it most needs to see. It also needs two server-side
   values (the model catalogue and the current category list), which a file
   under static/ is served as-is and never rendered by Jinja could not receive
   without a data island.

   Linked stylesheet, not an inline <style>: SPA navigation replaces <main>
   only, so a <link> in <head> would never arrive on a client-side navigation
   to this page. #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/rules.css') }}">

<div id="rules-page" class="ds-stack ds-stack-6">

  <!-- ── AI rule suggestions ─────────────────────────────────────────────── -->
  <section class="ds-card ds-card--wash-ai" aria-labelledby="aiRulesHeading">
    <div class="ds-card__head">
      <div>
        <h2 id="aiRulesHeading" class="ds-section__title">AI Rule Suggestions</h2>
        <p class="ds-section__sub">
          Analyze your uncategorized transactions and let Dough suggest rules.
          {% if uncategorized_count > 0 %}
          <strong>{{ uncategorized_count }} uncategorized transaction{{ 's' if uncategorized_count != 1 }} ready to analyze.</strong>
          {% else %}
          Everything is categorized.
          {% endif %}
        </p>
      </div>
    </div>

    <div class="rules-ai__controls">
      {# Rendered from dough/ai/catalog.py, not hardcoded: this list and
         chat's used to be separate copies that disagreed with each other and
         with the server. aria-pressed carries the selection, so the CSS and
         the screen reader read the same state — see rules.css. #}
      <div class="rules-seg" id="ai-model-picker" role="group" aria-label="Model">
        {% for m in ai_models %}
        <button type="button" class="rules-seg__btn" data-model="{{ m.id }}"
                aria-pressed="{{ 'true' if loop.first else 'false' }}"
                title="{{ m.short_description }}">{{ m.label }}</button>
        {% endfor %}
      </div>
      <span id="ai-model-desc" class="ds-meta">{{ ai_models[0].short_description }}</span>

      <button id="ai-analyze-btn" type="button" class="ds-btn ds-btn--primary"
              onclick="runAISuggest()"
              {% if uncategorized_count == 0 %}disabled{% endif %}>
        <svg id="ai-analyze-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
        </svg>
        <span id="ai-analyze-label">Analyze &amp; suggest rules</span>
      </button>
    </div>

    <div id="ai-suggestions-area" hidden>
      <div class="ds-row ds-row--between">
        <p id="ai-summary" class="ds-meta"></p>
        <div class="ds-row">
          <button id="ai-accept-all-btn" type="button" class="ds-btn ds-btn--sm ds-btn--primary"
                  onclick="acceptAllSuggestions()">Accept all</button>
          <button type="button" class="ds-btn ds-btn--sm ds-btn--secondary"
                  onclick="clearSuggestions()">Clear</button>
        </div>
      </div>

      <div id="ai-cards" class="rules-ai__cards"></div>
    </div>

    <div id="ai-error" class="ds-card ds-card--danger ds-card--compact" role="alert" hidden></div>
  </section>

  <!-- ── Add a rule (advanced) ───────────────────────────────────────────── -->
  {# Behind a <details> rather than removed. Dough writing the rules is the
     primary path now, so leading with an empty two-field form asked the user
     to do by hand the job the page exists to do for them. It stays reachable
     because the escape hatch is the thing that makes automation safe: when a
     suggestion gets a merchant wrong, "fix it yourself" has to be available.

     A details element, not a JS toggle: it opens and closes with no script at
     all, is keyboard accessible for free, and the disclosure state is the
     element's own rather than a class some other handler can disagree with. #}
  <details class="ds-card rules-advanced">
    <summary class="rules-advanced__summary">
      <span class="ds-section__title">Add a rule manually</span>
      <span class="ds-section__sub">Advanced — Dough writes these for you above.</span>
    </summary>

    <div class="ds-card__head">
      <div>
        <h2 id="addRuleHeading" class="ds-sr">Add a rule</h2>
        <p class="ds-section__sub">
          A keyword wrapped in slashes is treated as a regular expression —
          <code>/amazon|amzn/</code> matches either. Keep it specific: adding a
          rule recategorizes matching transactions across your whole ledger.
        </p>
      </div>
    </div>

    <form method="POST" id="addRuleForm" class="ds-stack ds-stack-4">
      {{ csrf_field() }}
      <input type="hidden" name="action" value="add">

      <div class="rules-form__grid">
        <div class="ds-field">
          <label class="ds-label" for="category">Category</label>
          <input class="ds-input" type="text" name="category" id="category" required>
        </div>
        <div class="ds-field">
          <label class="ds-label" for="keyword">Keyword or pattern</label>
          <input class="ds-input" type="text" name="keyword" id="keyword" required
                 oninput="schedulePreview()" autocomplete="off"
                 aria-describedby="previewBox"
                 placeholder="STARBUCKS, or /starbucks|sbux/">
        </div>
      </div>

      {# What this rule would catch, before it is saved. Adding a rule
         retroactively recategorizes matching transactions, so seeing the
         damage first is the difference between a tool and a gamble. #}
      <div id="previewBox" class="ds-card ds-card--wash ds-card--compact" hidden>
        <p class="ds-eyebrow">Would match — first 10</p>
        <div id="previewBody"></div>
      </div>
      <p id="previewNone" class="ds-hint" hidden>No existing transactions match this keyword.</p>

      <div>
        <button type="submit" class="ds-btn ds-btn--primary">Add rule</button>
      </div>
    </form>
  </details>

  <!-- ── Existing rules ──────────────────────────────────────────────────── -->
  <section class="ds-card" aria-labelledby="existingRulesHeading">
    <div class="ds-card__head">
      <div>
        <h2 id="existingRulesHeading" class="ds-section__title">Your rules</h2>
        <p class="ds-section__sub">
          Drag a row to reorder — rules higher in the list win. Transactions
          counts how many the rule <em>matches</em> now, so a category reading 0
          has rules that no longer catch anything.
        </p>
      </div>
      {% if rules %}
      {# Destructive and irreversible, so it confirms with the count in the
         question — "clear all rules" is easy to click without picturing what
         it removes. The re-derivation it triggers is the same one every rule
         edit runs; see dough/blueprints/rules.py::_recategorize. #}
      <form method="POST" class="rules-actions"
            onsubmit="return confirm('Delete all {{ rules.values()|map('length')|sum }} rules across {{ rules|length }} categor{{ 'y' if rules|length == 1 else 'ies' }}?\n\nEvery transaction they categorized goes back to Uncategorized. Nothing is seeded in their place.');">
        {{ csrf_field() }}
        <input type="hidden" name="action" value="clear_all">
        <button type="submit" class="ds-btn ds-btn--sm ds-btn--danger">Clear all rules</button>
      </form>
      {% endif %}
    </div>

    {% if rules %}
    <div class="ds-table-wrap ds-scroll">
      <table id="rulesTable" class="ds-table ds-table--hover">
        <thead>
          <tr>
            <th scope="col"><span class="ds-sr">Reorder</span></th>
            <th scope="col">Category</th>
            <th scope="col">Keywords &amp; patterns</th>
            <th scope="col" class="ds-table__num">Transactions</th>
            <th scope="col"><span class="ds-sr">Actions</span></th>
          </tr>
        </thead>
        <tbody id="rulesBody">
          {% for category, keywords in rules.items() %}
          <tr class="rules-row" draggable="true" data-category="{{ category }}">
            <td class="rules-grip" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                <path d="M7 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM7 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-6 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
              </svg>
            </td>
            <td class="rules-cell--category">{{ category }}</td>
            <td class="rules-cell--keywords">
              <div class="rules-keywords">
                {% for keyword in keywords %}
                <span class="ds-chip rules-keyword">
                  {{ keyword }}
                  <form method="POST">
                    {{ csrf_field() }}
                    <input type="hidden" name="action" value="remove">
                    <input type="hidden" name="category" value="{{ category }}">
                    <input type="hidden" name="keyword" value="{{ keyword }}">
                    <button type="submit" class="rules-keyword__x"
                            aria-label="Remove keyword {{ keyword }} from {{ category }}">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                           stroke="currentColor" stroke-width="2.4" aria-hidden="true">
                        <path stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/>
                      </svg>
                    </button>
                  </form>
                </span>
                {% endfor %}
              </div>
            </td>
            <td class="ds-table__num rules-cell--count">
              <a href="{{ url_for('transactions.index', category=category) }}">{{ rule_stats.get(category, 0) }}</a>
            </td>
            <td class="rules-cell--actions">
              {# `remove_category`, not `remove`. This posted `action=remove`
                 with no keyword, so the route called remove_rule(cat, None),
                 matched nothing, and flashed "Rule removed" anyway — the button
                 appeared to work and never did. See dough/blueprints/rules.py. #}
              <form method="POST" class="rules-actions">
                {{ csrf_field() }}
                <input type="hidden" name="action" value="remove_category">
                <input type="hidden" name="category" value="{{ category }}">
                <button type="submit" class="ds-btn ds-btn--sm ds-btn--danger"
                        onclick="return confirm('Delete the {{ category }} category and all {{ keywords|length }} of its keywords?')">
                  Delete category
                </button>
              </form>
              <form method="POST" class="rules-actions rules-rename"
                    onsubmit="return this.new_category.value.trim() !== ''">
                {{ csrf_field() }}
                <input type="hidden" name="action" value="rename_category">
                <input type="hidden" name="category" value="{{ category }}">
                <input type="text" name="new_category" class="ds-input ds-input--sm"
                       placeholder="Rename to…" aria-label="Rename {{ category }} to"
                       maxlength="50">
                <button type="submit" class="ds-btn ds-btn--sm ds-btn--secondary">
                  Rename
                </button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    {% else %}
    <div class="ds-empty">
      <p class="ds-empty__title">No rules yet</p>
      <p class="ds-empty__body">
        {% if autostart_ai %}
        Dough is reading your {{ uncategorized_count }} uncategorized
        transaction{{ 's' if uncategorized_count != 1 }} now and will suggest
        rules built from your own descriptions. Nothing is applied until you
        accept it.
        {% elif uncategorized_count > 0 %}
        Add one above, or let Dough read your uncategorized transactions and propose some.
        {% else %}
        Add one above. A new account starts with no rules — Dough does not
        guess at your banks, and never copies anyone else's.
        {% endif %}
      </p>
    </div>
    {% endif %}
  </section>
</div>

<script>
// ── AI suggestions ───────────────────────────────────────────────────────────
// From dough/ai/catalog.py, the same source as the buttons above.
const AI_MODELS = {{ ai_models|tojson }};
const AI_MODEL_DESCS = Object.fromEntries(
    AI_MODELS.map(function (m) { return [m.id, m.short_description]; }));
// This picker has always defaulted to the fastest model rather than the app-wide
// default: rule suggestion runs over up to 200 descriptions and the cheap model
// is the sensible starting point for a button the user presses repeatedly.
let aiSelectedModel = AI_MODELS[0].id;
let aiSuggestions   = [];

var segButtons = document.querySelectorAll('.rules-seg__btn');
segButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
        segButtons.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
        btn.setAttribute('aria-pressed', 'true');
        aiSelectedModel = btn.dataset.model;
        document.getElementById('ai-model-desc').textContent = AI_MODEL_DESCS[aiSelectedModel] || '';
    });
});

function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
}

function show(id, on) { document.getElementById(id).hidden = !on; }

function setAnalyzing(on) {
    document.getElementById('ai-analyze-btn').disabled = on;
    // The spinner is the design system's, so it turns at the same rate as every
    // other pending thing in the product.
    document.getElementById('ai-analyze-icon').classList.toggle('ds-spin', on);
    // Named for what it does now: one run reads every uncategorized
    // description, which takes longer than the old 200-row sample and should
    // look like it is doing more rather than like it has hung.
    document.getElementById('ai-analyze-label').textContent =
        on ? 'Analyzing every transaction…' : 'Analyze & suggest rules';
}

function failAI(message) {
    var box = document.getElementById('ai-error');
    box.textContent = message;
    box.hidden = false;
}

async function runAISuggest() {
    setAnalyzing(true);
    show('ai-suggestions-area', false);
    show('ai-error', false);
    document.getElementById('ai-cards').innerHTML = '';

    try {
        var res  = await fetch('/rules/ai-suggest', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({model: aiSelectedModel})
        });
        var data = await res.json();
        if (!res.ok || data.error) {
            failAI(data.error || 'Something went wrong. Please try again.');
            return;
        }
        aiSuggestions = data.suggestions || [];
        aiCoverage    = data;
        renderSuggestions();
    } catch (e) {
        failAI('Could not reach the server. Please try again.');
    } finally {
        setAnalyzing(false);
    }
}

var existingCategories = {{ rules.keys()|list|tojson }};
var aiCoverage = null;

// What the analysis actually read, in the user's words.
//
// One run now walks the whole uncategorized ledger rather than sampling its
// busiest 200 descriptions, and saying so is half the fix: the old behaviour
// trained people to press Analyze over and over because nothing ever told them
// the pass had been partial. Now the page says which it was.
function coverageNote() {
    if (!aiCoverage || !aiCoverage.analyzed_descriptions) return '';
    if (aiCoverage.skipped_descriptions > 0) {
        return ' Read ' + aiCoverage.analyzed_descriptions + ' of ' +
               aiCoverage.total_descriptions +
               ' uncategorized descriptions — accept these, then run it again ' +
               'for the rest.';
    }
    return ' Read all ' + aiCoverage.analyzed_descriptions +
           ' uncategorized descriptions — one pass covers the whole ledger.';
}

function renderSuggestions() {
    var cards = document.getElementById('ai-cards');
    var sumEl = document.getElementById('ai-summary');
    cards.innerHTML = '';

    if (aiSuggestions.length === 0) {
        sumEl.textContent = 'No suggestions — the remaining descriptions may be too ambiguous.' +
                            coverageNote();
        document.getElementById('ai-accept-all-btn').hidden = true;
        show('ai-suggestions-area', true);
        return;
    }

    sumEl.textContent = aiSuggestions.length +
        (aiSuggestions.length === 1 ? ' suggestion' : ' suggestions') + '.' +
        coverageNote();
    document.getElementById('ai-accept-all-btn').hidden = false;

    aiSuggestions.forEach(function (s, i) {
        // `is_new` comes from the server, which compares case-insensitively
        // against the household's real categories. Deciding it here meant two
        // cards for the same category could each call themselves new — and
        // accepting one made the other's badge false without a re-render.
        var catBadge = s.is_new
            ? '<span class="ds-badge ds-badge--ai">new category</span>'
            : '<span class="ds-badge">existing</span>';
        var matchBadge = s.uncat_count > 0
            ? '<span class="ds-badge ds-badge--ok">' + s.uncat_count + ' uncategorized</span>'
            : '<span class="ds-badge">' + s.total_count + ' total</span>';
        var examples = s.examples && s.examples.length
            ? '<p class="rules-sugg__examples" title="' + esc(s.examples.join(' · ')) + '">' +
              'e.g. ' + esc(s.examples.slice(0, 2).join(' · ')) + '</p>'
            : '';
        // One card per category now carries every pattern proposed for it.
        var patterns = (s.keywords || []).map(function (k) {
            return '<code class="rules-sugg__pattern">' + esc(k) + '</code>';
        }).join(' ');

        var card = document.createElement('div');
        card.className   = 'ds-card ds-card--compact rules-sugg';
        card.dataset.idx = i;
        card.innerHTML =
            '<div class="rules-sugg__row">' +
              '<div class="rules-sugg__main">' +
                '<div class="rules-sugg__badges">' +
                  '<span class="rules-sugg__name">' + esc(s.category) + '</span>' +
                  catBadge + matchBadge +
                '</div>' +
                '<div class="rules-sugg__patterns">' + patterns + '</div>' +
                '<p class="rules-sugg__reason">' + esc(s.reason) + '</p>' +
                examples +
              '</div>' +
              '<div class="rules-sugg__actions">' +
                '<button type="button" class="ds-btn ds-btn--sm ds-btn--primary" ' +
                  'data-accept="' + i + '">Accept</button>' +
                '<button type="button" class="ds-btn ds-btn--sm ds-btn--ghost" ' +
                  'data-skip="' + i + '">Skip</button>' +
              '</div>' +
            '</div>';
        cards.appendChild(card);
    });

    show('ai-suggestions-area', true);
}

// Delegated, so the handlers survive re-rendering and nothing has to be
// re-bound. One listener on the container that outlives every card in it.
document.getElementById('ai-cards').addEventListener('click', function (e) {
    var accept = e.target.closest('[data-accept]');
    if (accept) { acceptSuggestion(Number(accept.dataset.accept), accept); return; }
    var skip = e.target.closest('[data-skip]');
    if (skip) skipSuggestion(Number(skip.dataset.skip));
});

async function acceptSuggestion(idx, btn) {
    var s = aiSuggestions[idx];
    if (!s) return;
    var card = document.querySelector('.rules-sugg[data-idx="' + idx + '"]');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
        var res = await fetch('/rules/ai-apply', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({category: s.category, keywords: s.keywords})
        });
        var data = await res.json();
        if (!res.ok || data.error) {
            btn.disabled = false;
            btn.textContent = 'Retry';
            showToast(data.error || 'Could not save that rule.', 'error');
            return;
        }

        card.classList.add('rules-sugg--accepted');
        card.querySelector('.rules-sugg__actions').innerHTML =
            '<div class="rules-sugg__done">' +
              '<span class="ds-badge ds-badge--ok">Accepted</span>' +
              '<span class="ds-meta">' + data.applied_count + ' updated</span>' +
            '</div>';

        // Keep the local state in step so the badge is right on a re-render:
        // the category exists now, whatever the card said a moment ago.
        s.is_new = false;
        if (existingCategories.indexOf(s.category) === -1) {
            existingCategories.push(s.category);
        }
        showToast('"' + s.category + '" moved to top priority — ' +
                  data.applied_count + ' transaction(s) recategorized', 'success');
    } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Retry';
        showToast('Could not reach the server. Please try again.', 'error');
    }
}

function skipSuggestion(idx) {
    var card = document.querySelector('.rules-sugg[data-idx="' + idx + '"]');
    if (card) card.classList.add('rules-sugg--skipped');
}

// One request for every outstanding card, not one request per card.
//
// The loop version re-derived the whole ledger once per suggestion — six cards
// meant six full passes to reach a state one pass computes identically, since
// the final categories depend only on the final rule set. It was also not
// atomic: a failure on the fourth card left three rules written and the page
// showing six accepted.
async function acceptAllSuggestions() {
    var allBtn = document.getElementById('ai-accept-all-btn');

    var pending = [];
    aiSuggestions.forEach(function (s, i) {
        var card = document.querySelector('.rules-sugg[data-idx="' + i + '"]');
        if (!card) return;
        if (card.classList.contains('rules-sugg--accepted')) return;
        if (card.classList.contains('rules-sugg--skipped')) return;
        pending.push({idx: i, card: card, category: s.category, keywords: s.keywords});
    });

    if (!pending.length) { allBtn.textContent = 'Done'; return; }

    allBtn.disabled = true;
    allBtn.textContent = 'Accepting…';

    try {
        var res = await fetch('/rules/ai-apply', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({categories: pending.map(function (p) {
                return {category: p.category, keywords: p.keywords};
            })})
        });
        var data = await res.json();
        if (!res.ok || data.error) {
            allBtn.disabled = false;
            allBtn.textContent = 'Retry';
            showToast(data.error || 'Could not save those rules.', 'error');
            return;
        }

        // The recategorized count belongs to the batch, not to any one card, so
        // the cards say they were accepted and the toast carries the total.
        pending.forEach(function (p) {
            p.card.classList.add('rules-sugg--accepted');
            p.card.querySelector('.rules-sugg__actions').innerHTML =
                '<div class="rules-sugg__done">' +
                  '<span class="ds-badge ds-badge--ok">Accepted</span>' +
                '</div>';
        });
        allBtn.textContent = 'Done';
        showToast(data.added + ' rule(s) added — ' + data.applied_count +
                  ' transaction(s) recategorized', 'success');
    } catch (e) {
        allBtn.disabled = false;
        allBtn.textContent = 'Retry';
        showToast('Could not reach the server. Please try again.', 'error');
    }
}

function clearSuggestions() {
    aiSuggestions = [];
    aiCoverage = null;
    show('ai-suggestions-area', false);
    show('ai-error', false);
}

// ── Keyword preview ──────────────────────────────────────────────────────────
var previewTimer = null;
function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(runPreview, 400);
}

function runPreview() {
    var kw = document.getElementById('keyword').value.trim();
    var body = document.getElementById('previewBody');
    if (!kw) { show('previewBox', false); show('previewNone', false); return; }

    fetch('/rules/test', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({keyword: kw})
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
        body.innerHTML = '';
        if (!data.matches || !data.matches.length) {
            show('previewBox', false);
            show('previewNone', true);
            return;
        }
        data.matches.forEach(function (m) {
            var amount = parseFloat(m.amount);
            var row = document.createElement('div');
            row.className = 'rules-preview__row';
            row.innerHTML =
                '<span class="rules-preview__date">' + esc(m.date) + '</span>' +
                '<span class="rules-preview__desc">' + esc(m.description) + '</span>' +
                '<span class="rules-preview__amt ' +
                  (amount >= 0 ? 'rules-preview__amt--in' : 'rules-preview__amt--out') + '">$' +
                  Math.abs(amount).toLocaleString('en-US',
                      {minimumFractionDigits: 2, maximumFractionDigits: 2}) +
                '</span>';
            body.appendChild(row);
        });
        show('previewBox', true);
        show('previewNone', false);
    })
    .catch(function () { show('previewBox', false); show('previewNone', false); });
}

// ── Drag to reorder ──────────────────────────────────────────────────────────
var tbody = document.getElementById('rulesBody');
var dragging = null;

if (tbody) {
    tbody.addEventListener('dragstart', function (e) {
        dragging = e.target.closest('tr');
        // Deferred a tick: applying the class synchronously would make the
        // browser snapshot the *faded* row as the drag image.
        setTimeout(function () {
            if (dragging) dragging.classList.add('rules-row--dragging');
        }, 0);
    });

    tbody.addEventListener('dragend', function () {
        if (dragging) dragging.classList.remove('rules-row--dragging');
        dragging = null;
        saveOrder();
    });

    tbody.addEventListener('dragover', function (e) {
        e.preventDefault();
        var target = e.target.closest('tr');
        if (!target || !dragging || target === dragging) return;
        var rows = Array.from(tbody.querySelectorAll('tr'));
        if (rows.indexOf(dragging) < rows.indexOf(target)) {
            tbody.insertBefore(dragging, target.nextSibling);
        } else {
            tbody.insertBefore(dragging, target);
        }
    });
}

function saveOrder() {
    var rows = Array.from(tbody.querySelectorAll('tr[data-category]'));
    fetch('/rules/reorder', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({order: rows.map(function (r) { return r.dataset.category; })})
    })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.success) showToast('Rule order saved.', 'success'); })
    .catch(function () { showToast('Could not save the new order.', 'error'); });
}

// ── First-run rule suggestions  [Phase 11A.2] ────────────────────────────────
// A household with no rules used to be given `rules.DEFAULT_RULES`, which was
// the developer's own banks and lenders copied into every new account. Nothing
// is seeded now; instead the analysis that reads *this* household's own
// descriptions starts on its own, once, the first time somebody opens a Rules
// page with no rules on it.
//
// The server decides whether that applies -- rules empty, something
// uncategorized to read, and an API key configured -- because all three facts
// live there. See dough/blueprints/rules.py::index.
//
// It only proposes. `runAISuggest` renders cards and waits, exactly as the
// button does, so nothing reaches the ledger without somebody accepting it.
{% if autostart_ai %}
document.addEventListener('DOMContentLoaded', function () {
    runAISuggest();
});
{% endif %}
</script>
