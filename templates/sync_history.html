{% extends "base.html" %}
{% block title %}Sync History · Dough{% endblock %}

{% block content %}
{# Phase 9 Wave 4. Linked stylesheet, not an inline <style>: SPA navigation
   replaces <main> only, so a <link> in <head> would never arrive on a
   client-side navigation to this page. #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/sync_history.css') }}">

<div class="ds-stack ds-stack-6">

    <!-- Header -->
    <div class="ds-row ds-row--between ds-row--wrap">
        <div>
            <h1 class="ds-section__title">Sync History</h1>
            <p class="ds-section__sub">Every synchronization run and any errors encountered</p>
        </div>
        <a href="/connections" class="ds-btn ds-btn--secondary">← Connections</a>
    </div>

    <!-- Runs -->
    <section class="ds-card" aria-labelledby="syncRunsHeading">
        <div class="ds-card__head">
            <h2 id="syncRunsHeading" class="ds-section__title">Synchronization Runs</h2>
        </div>
        {% if runs %}
        <div class="ds-table-wrap ds-scroll">
            <table class="ds-table ds-table--hover">
                <thead>
                    <tr>
                        <th scope="col">Started</th>
                        <th scope="col">Institution</th>
                        <th scope="col">Trigger</th>
                        <th scope="col">Status</th>
                        <th scope="col" class="ds-table__num">Accounts</th>
                        <th scope="col" class="ds-table__num">Holdings</th>
                        <th scope="col" class="ds-table__num">Txns Added</th>
                        <th scope="col" class="ds-table__num">Txns Skipped</th>
                        <th scope="col">Error</th>
                    </tr>
                </thead>
                <tbody>
                    {% for r in runs %}
                    <tr>
                        <td class="ds-meta">{{ r.started_at }}</td>
                        <td class="sync-capitalize">{{ (r.institution or 'all').replace('_', ' ') }}</td>
                        <td class="ds-meta sync-capitalize">{{ r.trigger }}</td>
                        <td>
                            <span class="ds-badge sync-capitalize {{ 'ds-badge--ok' if r.status == 'success'
                                else 'ds-badge--info' if r.status == 'running'
                                else 'ds-badge--warn' if r.status == 'partial'
                                else 'ds-badge--danger' }}">
                                {{ r.status }}
                            </span>
                        </td>
                        <td class="ds-table__num">{{ r.accounts_synced }}</td>
                        <td class="ds-table__num">{{ r.holdings_synced }}</td>
                        <td class="ds-table__num">{{ r.transactions_added }}</td>
                        <td class="ds-table__num ds-meta">{{ r.transactions_skipped }}</td>
                        <td class="sync-truncate sync-error-text" title="{{ r.error_message or '' }}">{{ r.error_message or '—' }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <p class="sync-empty">No synchronization runs yet.</p>
        {% endif %}
    </section>

    <!-- Errors -->
    {% if errors %}
    <section class="ds-card" aria-labelledby="syncErrorsHeading">
        <div class="ds-card__head">
            <h2 id="syncErrorsHeading" class="ds-section__title">Recent Errors</h2>
        </div>
        <div class="ds-table-wrap ds-scroll">
            <table class="ds-table ds-table--hover">
                <thead>
                    <tr>
                        <th scope="col">When</th>
                        <th scope="col">Institution</th>
                        <th scope="col">Type</th>
                        <th scope="col">Attempt</th>
                        <th scope="col">Message</th>
                    </tr>
                </thead>
                <tbody>
                    {% for e in errors %}
                    <tr>
                        <td class="ds-meta">{{ e.created_at }}</td>
                        <td class="sync-capitalize">{{ (e.institution or '—').replace('_', ' ') }}</td>
                        <td>
                            <span class="ds-badge {{ 'ds-badge--warn' if e.is_transient else 'ds-badge--danger' }}">
                                {{ e.error_type }}
                            </span>
                        </td>
                        <td class="ds-meta">{{ e.attempt }}</td>
                        <td class="sync-truncate sync-truncate--wide ds-meta" title="{{ e.message }}">{{ e.message }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>
    {% endif %}

</div>
{% endblock %}
