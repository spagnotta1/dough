<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Dough app icon">
  <title>Dough</title>

  <!-- ═══════════════════════════════════════════════════════════════════
       Dough — app icon.

       Just the dog. An earlier version put a rising growth line behind him
       to say "finance", and it cost more than it bought: at 40px the thin
       stroke broke up into noise, its glow bloomed over the muzzle, and the
       icon ended up telling two stories at once. A store grid rewards one
       memorable shape, and the friendly face is the memorable shape — the
       finance context is supplied by everything around the icon.

       Geometry is shared with the mascot in static/js/dough.js path-for-path,
       so the icon and the character in the product are provably the same dog.
       If one changes, change the other.

       Sizing: the dog occupies ~81% of the tile width, leaving a >9% margin
       on every side so nothing lands under the rounded-corner mask on iOS or
       the circular/squircle mask on Android. tools/build_icons.py rasterizes
       this file, and for the 16/32px favicons scales the dog up to fill the
       tile, since at a tab's size the padding is the first thing to waste.
       ═══════════════════════════════════════════════════════════════════ -->

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#9061f9"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="fur" x1="0.25" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f4cb96"/>
      <stop offset="0.55" stop-color="#e6ab6c"/>
      <stop offset="1" stop-color="#d69350"/>
    </linearGradient>
    <linearGradient id="earFur" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#eab179"/>
      <stop offset="1" stop-color="#cd8b4b"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="0" y="0" width="512" height="512" rx="114" ry="114"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">

    <!-- Ground shadow — anchors the dog on the tile so he reads as lying
         down rather than floating. Kept soft; a hard edge at 40px looks
         like a second object. -->
    <ellipse class="fine" cx="256" cy="404" rx="196" ry="34" fill="#3b0f7a" opacity="0.28"/>

    <!-- DOUGH.  scale(0.9) is the safe-area fit described above. -->
    <g transform="translate(256,256) scale(0.9) translate(-256,-328)">

      <g stroke="#5c3a22" stroke-width="10" stroke-linejoin="round">

        <!-- Ears: long soft curves, hanging wider than the head -->
        <path d="M176 216 C132 196, 82 216, 58 262 C30 282, 26 340, 48 378
                 C58 420, 100 452, 142 440 C170 430, 182 406, 177 380
                 C186 326, 186 250, 176 216 Z" fill="url(#earFur)"/>
        <path d="M336 216 C380 196, 430 216, 454 262 C482 282, 486 340, 464 378
                 C454 420, 412 452, 370 440 C342 430, 330 406, 335 380
                 C326 326, 326 250, 336 216 Z" fill="url(#earFur)"/>

        <!-- Head: nine outward bumps across the crown make the fluffy
             doodle silhouette. This is the shape people recognise, so it
             survives at every size. -->
        <path d="M131.9 278.5 Q125.1 255.7 144.8 241.8 Q145.4 217.9 168.5 210.8
                 Q176.5 188.3 200.8 188.6 Q215.5 169.5 238.5 177.2 Q258.5 163.6 277.9 177.9
                 Q301.2 171.0 315.2 190.5 Q339.4 191.1 346.6 213.9 Q369.4 221.9 369.2 245.7
                 Q388.4 260.2 380.8 282.7 C388 340, 380 396, 330 428 C302 445, 210 445, 182 428
                 C132 396, 124 340, 131.9 278.5 Z" fill="url(#fur)"/>

        <!-- Muzzle: two cheek lobes dipping under the nose -->
        <path d="M256 374 C250 356, 226 350, 206 352 C168 356, 146 380, 146 404
                 C146 432, 174 450, 206 450 C232 450, 250 440, 256 424
                 C262 440, 280 450, 306 450 C338 450, 366 432, 366 404
                 C366 380, 344 356, 306 352 C286 350, 262 356, 256 374 Z"
              fill="#f9dfba" transform="translate(256,404) scale(1.1) translate(-256,-404)"/>

        <!-- Front paws, chin resting between them -->
        <path class="fine" d="M150 430 C112 430, 92 448, 92 468 C92 486, 116 494, 152 494
                 C190 494, 214 486, 214 468 C214 448, 190 430, 150 430 Z" fill="#f6d3a4"/>
        <path class="fine" d="M362 430 C400 430, 420 448, 420 468 C420 486, 396 494, 360 494
                 C322 494, 298 486, 298 468 C298 448, 322 430, 362 430 Z" fill="#f6d3a4"/>
        <g class="fine" fill="none" stroke="#5c3a22" stroke-width="8" stroke-linecap="round">
          <path d="M130 462 L128 492"/><path d="M172 462 L172 494"/>
          <path d="M382 462 L384 492"/><path d="M340 462 L340 494"/>
        </g>
      </g>

      <!-- Fur texture. Low contrast on purpose: below ~48px these should
           read as shading, never as stripes. -->
      <g class="fine" fill="none" stroke="#5c3a22" stroke-width="7" stroke-linecap="round" opacity="0.5">
        <path d="M84 300 C76 326, 78 356, 92 380"/>
        <path d="M132 332 C128 352, 132 372, 141 386"/>
        <path d="M428 300 C436 326, 434 356, 420 380"/>
        <path d="M380 332 C384 352, 380 372, 371 386"/>
      </g>

      <!-- Forehead cowlick -->
      <path class="fine" d="M240 246 C244 224, 256 224, 258 242 C262 224, 274 226, 274 246"
            fill="none" stroke="#5c3a22" stroke-width="8" stroke-linecap="round"/>

      <!-- Eyes. The catchlight-plus-sparkle pairing is what makes the face
           read as optimistic rather than sleepy — it is the single detail
           worth protecting at small sizes, so both are oversized here. -->
      <g transform="rotate(-7 202 320)">
        <ellipse cx="202" cy="320" rx="36" ry="43" fill="#3b2317"/>
        <ellipse cx="202" cy="337.2" rx="23.8" ry="12.9" fill="#7c4b2c" opacity="0.92"/>
        <circle cx="189" cy="303" r="12" fill="#ffffff"/>
        <path fill="#ffffff" d="M213 313 Q215.5 315.5 223.5 318 Q215.5 320.5 213 328.5
                                Q210.5 320.5 202.5 318 Q210.5 315.5 213 313 Z"/>
      </g>
      <g transform="rotate(7 310 320)">
        <ellipse cx="310" cy="320" rx="36" ry="43" fill="#3b2317"/>
        <ellipse cx="310" cy="337.2" rx="23.8" ry="12.9" fill="#7c4b2c" opacity="0.92"/>
        <circle cx="297" cy="303" r="12" fill="#ffffff"/>
        <path fill="#ffffff" d="M321 313 Q323.5 315.5 331.5 318 Q323.5 320.5 321 328.5
                                Q318.5 320.5 310.5 318 Q318.5 315.5 321 313 Z"/>
      </g>

      <!-- Nose + resting smile -->
      <path d="M224 366 C224 352, 288 352, 288 366 C288 386, 272 398, 256 398
               C240 398, 224 386, 224 366 Z" fill="#7a5138"/>
      <ellipse cx="246" cy="364" rx="14" ry="6" fill="#b08160" opacity="0.5"/>
      <g fill="none" stroke="#5c3a22" stroke-width="9" stroke-linecap="round">
        <path d="M256 398 L256 424"/>
        <path d="M230 434 C242 450, 270 450, 282 434"/>
      </g>

    </g>
  </g>
</svg>
